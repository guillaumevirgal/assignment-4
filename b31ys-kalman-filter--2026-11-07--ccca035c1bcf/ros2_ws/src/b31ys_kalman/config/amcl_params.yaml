# AMCL (nav2_amcl) localisation of the ROSbot in the saved SLAM map.
# Values are the Nav2 Humble defaults except the lines marked B31YS.
amcl:
  ros__parameters:
    use_sim_time: true

    # Frames and topics
    global_frame_id: map
    odom_frame_id: odom
    base_frame_id: base_link            # B31YS: ROSbot has no base_footprint
    scan_topic: /scan_filtered          # B31YS: scan without the robot's own body
    map_topic: map
    tf_broadcast: true
    transform_tolerance: 1.0

    # Start pose: the map was built from the spawn point, so the robot
    # starts at the map origin. Can be changed in RViz ("2D Pose Estimate").
    set_initial_pose: true              # B31YS
    always_reset_initial_pose: false
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0

    # Motion model (odometry noise)
    robot_model_type: nav2_amcl::DifferentialMotionModel
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2

    # Laser model
    laser_model_type: likelihood_field
    laser_min_range: -1.0
    laser_max_range: 12.0               # B31YS: reliable RPLidar range (map is 24 x 24 m)
    laser_likelihood_max_dist: 2.0
    max_beams: 60
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    sigma_hit: 0.2
    lambda_short: 0.1
    do_beamskip: false
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3

    # Particle filter
    min_particles: 500
    max_particles: 2000
    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 1
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    update_min_d: 0.10                  # B31YS: update every 10 cm (default 0.25)
    update_min_a: 0.10                  # B31YS: and every ~6 deg (default 0.2)
    save_pose_rate: 0.5
